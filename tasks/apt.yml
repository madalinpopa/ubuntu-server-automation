---
# Base packages and time zone.
# Full upgrades are not done here. unattended-upgrades installs security
# updates every day (see tasks/updates.yml). Run "sudo apt full-upgrade"
# yourself when you want everything else.

- name: Update the apt package index if it is older than one hour
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - ca-certificates       # Trusted certificates for HTTPS downloads
      - curl                  # Download files and test web servers
      - python3-debian        # Needed by Ansible's deb822_repository module
      - ufw                   # Uncomplicated Firewall
      - unattended-upgrades   # Automatic security updates
      - bash-completion       # Tab completion in the shell
      - vim                   # Text editor
      - git                   # Version control
    state: present

- name: Install extra packages
  ansible.builtin.apt:
    name: "{{ extra_packages }}"
    state: present
  when: extra_packages | length > 0

- name: Set the time zone
  community.general.timezone:
    name: "{{ timezone }}"
