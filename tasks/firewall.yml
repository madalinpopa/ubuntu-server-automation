---
# Firewall with UFW (Uncomplicated Firewall).
# Order matters: the SSH rule is added before UFW is enabled, so the
# connection Ansible uses is never blocked.
# Rules apply to IPv4 and IPv6 (IPV6=yes in /etc/default/ufw).

- name: Make sure UFW also filters IPv6
  ansible.builtin.lineinfile:
    path: /etc/default/ufw
    regexp: "^IPV6="
    line: "IPV6=yes"
    owner: root
    group: root
    mode: "0644"
  notify: Reload ufw

- name: Allow SSH
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port | string }}"
    proto: tcp
    comment: ssh

- name: Allow extra TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item | string }}"
    proto: tcp
  loop: "{{ firewall_allowed_tcp_ports }}"

- name: Deny incoming connections by default
  community.general.ufw:
    default: deny
    direction: incoming

- name: Allow outgoing connections by default
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Enable UFW
  community.general.ufw:
    state: enabled
