---
# Writes /etc/caddy/Caddyfile and reloads Caddy when it changed.
# Used by tasks/caddy.yml and by playbooks/services.yml, so turning a
# service on or off also updates its Caddy site.

- name: Write the Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: "0644"
    validate: caddy validate --adapter caddyfile --config %s
  notify: Reload caddy
