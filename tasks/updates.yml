---
# Automatic security updates with unattended-upgrades.
# Ubuntu enables this by default. These tasks make sure it stays enabled.
# Ubuntu's default only installs updates from the Ubuntu archive and
# the security pocket. Packages from Docker's and Caddy's repositories are
# not updated automatically. The server never reboots on its own. Check
# /var/run/reboot-required and reboot when it suits you.

- name: Enable daily package list updates and unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: Enable the apt timers that run the updates
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: started
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
