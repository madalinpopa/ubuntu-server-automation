---
# SSH server hardening with a drop-in file.
#
# Ubuntu's /etc/ssh/sshd_config includes /etc/ssh/sshd_config.d/*.conf at the
# top, and sshd keeps the first value it reads for each keyword. A file named
# 00-*.conf is read before cloud-init's 50-cloud-init.conf, so its values win.
#
# The SSH port is not changed. On Ubuntu 24.04 and later sshd is started by
# systemd socket activation (ssh.socket), and the port comes from the socket
# unit. Changing it safely needs more steps than this project takes on.

- name: Check that sshd listens on ssh_port before changing anything
  ansible.builtin.command: ss -Htln "sport = :{{ ssh_port }}"
  changed_when: false
  register: ssh_listeners
  failed_when: ssh_listeners.stdout | length == 0

- name: Write the SSH hardening drop-in
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0644"
    # Checks the new file on its own before it is put in place.
    validate: /usr/sbin/sshd -t -f %s
  notify: Reload ssh

- name: Test the complete sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

- name: Apply SSH changes now
  ansible.builtin.meta: flush_handlers

- name: Read the effective sshd settings
  ansible.builtin.command: /usr/sbin/sshd -T
  changed_when: false
  register: ssh_effective

- name: Check that the hardening settings are in effect
  ansible.builtin.assert:
    that:
      - "'passwordauthentication no' in ssh_effective.stdout_lines"
      - "'kbdinteractiveauthentication no' in ssh_effective.stdout_lines"
      - "'permitrootlogin no' in ssh_effective.stdout_lines"
      - "'pubkeyauthentication yes' in ssh_effective.stdout_lines"
    fail_msg: >-
      sshd -T does not show the expected values. Another file in
      /etc/ssh/sshd_config.d/ that sorts before 00-hardening.conf may override them.
    quiet: true

# Prove that a new SSH login still works with the new settings. The check
# logs in as the admin user over a new connection (ControlPath=none turns
# off SSH connection sharing, so an open session cannot hide a failure).
#
# The rest of the run keeps using the connection Ansible already has open.
# Existing SSH sessions survive the reload, so a first run that connects as
# root can finish even though root login is now turned off. Later runs must
# connect as admin_user.
- name: Check that the admin user can still log in with an SSH key
  ansible.builtin.command: id -un
  become: false
  vars:
    ansible_user: "{{ admin_user }}"
    ansible_ssh_args: "-o ControlMaster=no -o ControlPath=none"
    ansible_ssh_extra_args: "-o PreferredAuthentications=publickey"
  changed_when: false
