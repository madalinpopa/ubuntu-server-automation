---
# Read-only checks of the real server state. Nothing is changed.
# Run: ansible-playbook playbooks/verify.yml
# Every check prints a message that says what is wrong when it fails.

- name: Verify the server
  hosts: all
  become: true

  vars:
    # Public TCP ports that may be open besides SSH (and 80/443 with Caddy).
    verify_allowed_public_tcp_ports: "{{ firewall_allowed_tcp_ports }}"
    verify_expected_public_tcp_ports: >-
      {{ ([ssh_port | int]
          + (verify_allowed_public_tcp_ports | map('int') | list)
          + ([80, 443] if caddy_enabled | bool else [])) | unique | sort }}
    verify_units_base:
      - ssh.socket
      - ufw.service
      - unattended-upgrades.service
      - apt-daily.timer
      - apt-daily-upgrade.timer
    verify_units: >-
      {{ verify_units_base
         + (['fail2ban.service'] if fail2ban_enabled | bool else [])
         + (['containerd.service', 'docker.service'] if docker_enabled | bool else [])
         + (['caddy.service'] if caddy_enabled | bool else []) }}
    # Containers of the optional services that are turned on.
    verify_containers: >-
      {{ (['postgres'] if postgresql_enabled | bool else [])
         + (['pgadmin'] if pgadmin_enabled | bool else [])
         + (['gitea'] if gitea_enabled | bool else [])
         + (['umami'] if umami_enabled | bool else [])
         + (['semaphore'] if semaphore_enabled | bool else [])
         + (['memos'] if memos_enabled | bool else [])
         + (['ntfy'] if ntfy_enabled | bool else []) }}
    verify_caddy_ca: /var/lib/caddy/.local/share/caddy/pki/authorities/local/root.crt

  tasks:
    # --- System ---------------------------------------------------------------
    - name: Check the Ubuntu release
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version in supported_ubuntu_versions
        fail_msg: "Unsupported OS: {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}."
        quiet: true

    - name: Read time sync status
      ansible.builtin.command: timedatectl show -p NTP --value
      changed_when: false
      register: verify_ntp

    - name: Check that time sync is turned on
      ansible.builtin.assert:
        that: verify_ntp.stdout == 'yes'
        fail_msg: "Network time sync is off. Check systemd-timesyncd (24.04) or chrony (26.04)."
        quiet: true

    - name: Read the state of required systemd units
      # With only a name, this module reads the unit state and changes nothing.
      ansible.builtin.systemd_service:
        name: "{{ item }}"
      register: verify_units_state
      loop: "{{ verify_units }}"

    - name: Check that required units are enabled at boot and active
      ansible.builtin.assert:
        that:
          - item.status.UnitFileState == 'enabled'
          - item.status.ActiveState == 'active'
        fail_msg: >-
          {{ item.item }} is '{{ item.status.UnitFileState }}' and '{{ item.status.ActiveState }}',
          expected 'enabled' and 'active'. See: journalctl -u {{ item.item }}
        quiet: true
      loop: "{{ verify_units_state.results }}"
      loop_control:
        label: "{{ item.item }}"

    # --- Automatic security updates -------------------------------------------
    - name: Read the effective apt periodic settings
      ansible.builtin.command: apt-config dump APT::Periodic
      changed_when: false
      register: verify_apt_periodic

    - name: Read the automatic reboot setting
      ansible.builtin.command: apt-config dump Unattended-Upgrade::Automatic-Reboot
      changed_when: false
      register: verify_auto_reboot

    - name: Check that unattended security upgrades run daily without rebooting
      ansible.builtin.assert:
        that:
          - "'APT::Periodic::Update-Package-Lists \"1\";' in verify_apt_periodic.stdout_lines"
          - "'APT::Periodic::Unattended-Upgrade \"1\";' in verify_apt_periodic.stdout_lines"
          - "'true' not in verify_auto_reboot.stdout"
        fail_msg: >-
          Automatic updates are not set up as expected. apt-config shows:
          {{ verify_apt_periodic.stdout_lines }} {{ verify_auto_reboot.stdout_lines }}
        quiet: true

    # --- Admin user -----------------------------------------------------------
    - name: Read the admin user's groups
      ansible.builtin.command: id -nG {{ admin_user }}
      changed_when: false
      register: verify_admin_groups

    - name: Check that the admin user is in the sudo group
      ansible.builtin.assert:
        that: "'sudo' in verify_admin_groups.stdout.split()"
        fail_msg: "{{ admin_user }} is not in the sudo group (groups: {{ verify_admin_groups.stdout }})."
        quiet: true

    - name: Read the admin user's password field
      ansible.builtin.getent:
        database: shadow
        key: "{{ admin_user }}"
      no_log: true

    - name: Check that the admin user has a password for sudo
      ansible.builtin.assert:
        that: ansible_facts.getent_shadow[admin_user][0] is match('^\$')
        fail_msg: "{{ admin_user }} has no password, so sudo cannot work. Set vault_admin_password_hash."
        quiet: true
      no_log: true
      when: not admin_sudo_nopasswd | bool

    - name: Read the admin user's SSH files
      ansible.builtin.stat:
        path: "{{ item.path }}"
      register: verify_admin_ssh_files
      loop:
        - { path: "~{{ admin_user }}/.ssh", mode: "0700" }
        - { path: "~{{ admin_user }}/.ssh/authorized_keys", mode: "0600" }
      loop_control:
        label: "{{ item.path }}"

    - name: Check owner and permissions of the admin user's SSH files
      ansible.builtin.assert:
        that:
          - item.stat.exists
          - item.stat.pw_name == admin_user
          - item.stat.mode == item.item.mode
        fail_msg: >-
          {{ item.item.path }} must exist, belong to {{ admin_user }} and have mode
          {{ item.item.mode }}. It has owner {{ item.stat.pw_name | default('none') }}
          and mode {{ item.stat.mode | default('none') }}.
        quiet: true
      loop: "{{ verify_admin_ssh_files.results }}"
      loop_control:
        label: "{{ item.item.path }}"

    - name: Check that the admin user can log in with an SSH key
      ansible.builtin.command: id -un
      become: false
      vars:
        ansible_user: "{{ admin_user }}"
        ansible_ssh_extra_args: "-o PreferredAuthentications=publickey"
      changed_when: false

    # --- SSH server -----------------------------------------------------------
    - name: Read the SSH hardening drop-in file
      ansible.builtin.stat:
        path: /etc/ssh/sshd_config.d/00-hardening.conf
      register: verify_sshd_dropin

    - name: Check the SSH hardening drop-in file
      ansible.builtin.assert:
        that:
          - verify_sshd_dropin.stat.exists
          - verify_sshd_dropin.stat.pw_name == 'root'
          - verify_sshd_dropin.stat.mode == '0644'
        fail_msg: "/etc/ssh/sshd_config.d/00-hardening.conf is missing or has the wrong owner or mode."
        quiet: true

    - name: Read the effective sshd settings
      ansible.builtin.command: /usr/sbin/sshd -T
      changed_when: false
      register: verify_sshd

    - name: Check the effective sshd settings
      ansible.builtin.assert:
        that: item in verify_sshd.stdout_lines
        fail_msg: "sshd -T does not show '{{ item }}'. Another sshd_config.d file may override it."
        quiet: true
      loop:
        - "port {{ ssh_port }}"
        - permitrootlogin no
        - passwordauthentication no
        - kbdinteractiveauthentication no
        - pubkeyauthentication yes
        - x11forwarding no

    # --- Firewall and listening ports -----------------------------------------
    - name: Read the firewall status
      ansible.builtin.command: ufw status verbose
      changed_when: false
      register: verify_ufw

    - name: Check the firewall defaults
      ansible.builtin.assert:
        that:
          - "'Status: active' in verify_ufw.stdout"
          - "'deny (incoming)' in verify_ufw.stdout"
          - "'allow (outgoing)' in verify_ufw.stdout"
        fail_msg: "UFW must be active with 'deny (incoming)' and 'allow (outgoing)'. Got: {{ verify_ufw.stdout_lines }}"
        quiet: true

    - name: Check that each expected port is allowed for IPv4 and IPv6
      ansible.builtin.assert:
        that:
          - verify_ufw.stdout is search('(?m)^' ~ item ~ '/tcp +ALLOW IN +Anywhere( |$)')
          - verify_ufw.stdout is search('(?m)^' ~ item ~ '/tcp \(v6\) +ALLOW IN +Anywhere \(v6\)')
        fail_msg: "UFW has no IPv4 and IPv6 allow rule for {{ item }}/tcp."
        quiet: true
      loop: "{{ verify_expected_public_tcp_ports }}"

    - name: Read listening TCP sockets
      ansible.builtin.command: ss -Htln
      changed_when: false
      register: verify_ss

    - name: Find ports that listen on a public address
      ansible.builtin.set_fact:
        verify_public_tcp_ports: >-
          {{ verify_ss.stdout_lines
             | map('regex_replace', '^\S+\s+\S+\s+\S+\s+(\S+)\s.*$', '\1')
             | reject('match', '^(127\.|\[::1\]|\[::ffff:127\.)')
             | reject('search', '%lo:')
             | map('regex_replace', '^.*:', '')
             | map('int') | unique | sort }}

    - name: Check that only expected ports listen on public addresses
      ansible.builtin.assert:
        that: verify_public_tcp_ports | difference(verify_expected_public_tcp_ports) | length == 0
        fail_msg: >-
          Unexpected public listeners on TCP ports
          {{ verify_public_tcp_ports | difference(verify_expected_public_tcp_ports) }}.
          Docker-published ports bypass UFW. Publish them as 127.0.0.1:PORT:PORT.
          See: sudo ss -tlnp
        quiet: true

    # --- fail2ban -------------------------------------------------------------
    - name: Read the fail2ban sshd jail
      ansible.builtin.command: fail2ban-client status sshd
      changed_when: false
      failed_when: false
      register: verify_fail2ban
      when: fail2ban_enabled | bool

    - name: Check that the fail2ban sshd jail is running
      ansible.builtin.assert:
        that: verify_fail2ban.rc == 0
        fail_msg: "The fail2ban sshd jail is not running: {{ verify_fail2ban.stderr | default('') }}"
        quiet: true
      when: fail2ban_enabled | bool

    # --- Docker ---------------------------------------------------------------
    - name: Read the Docker daemon config
      ansible.builtin.slurp:
        src: /etc/docker/daemon.json
      register: verify_docker_daemon
      when: docker_enabled | bool

    - name: Check the default publish address in the Docker config
      ansible.builtin.assert:
        that: (verify_docker_daemon.content | b64decode | from_json).ip == docker_default_bind_ip
        fail_msg: "/etc/docker/daemon.json must set \"ip\": \"{{ docker_default_bind_ip }}\"."
        quiet: true
      when: docker_enabled | bool

    - name: Read docker group members
      ansible.builtin.getent:
        database: group
        key: docker
      when: docker_enabled | bool

    - name: Check that only docker_users are in the docker group
      ansible.builtin.assert:
        that: >-
          (ansible_facts.getent_group.docker[2] | split(',') | select | sort)
          == (docker_users | sort)
        fail_msg: >-
          docker group members are '{{ ansible_facts.getent_group.docker[2] }}',
          expected {{ docker_users }}. Members of the docker group have root access.
        quiet: true
      when: docker_enabled | bool

    - name: Check that the Docker daemon answers
      ansible.builtin.command: docker info --format '{{ "{{" }} .ServerVersion {{ "}}" }}'
      changed_when: false
      when: docker_enabled | bool

    # --- Caddy ----------------------------------------------------------------
    - name: Check that Caddy serves the site on this server
      ansible.builtin.uri:
        url: http://127.0.0.1/
        status_code: 200
      when:
        - caddy_enabled | bool
        - caddy_site_address is match(':')

    # --- Optional services ----------------------------------------------------
    - name: Read the service containers
      community.docker.docker_container_info:
        name: "{{ item }}"
      register: verify_container_info
      loop: "{{ verify_containers }}"
      # The result includes the container environment, which holds passwords.
      no_log: true

    - name: Keep the container details the checks need
      ansible.builtin.set_fact:
        verify_container_state: >-
          {{ verify_container_state | default([])
             + [{'name': item.item,
                 'exists': item.exists,
                 'running': item.container.State.Running | default(false),
                 'health': item.container.State.Health.Status | default('none'),
                 'restart': item.container.HostConfig.RestartPolicy.Name | default(''),
                 'bindings': item.container.HostConfig.PortBindings | default({}, true)
                             | dict2items | map(attribute='value') | flatten,
                 'networks': item.container.NetworkSettings.Networks | default({}) | list}] }}
      loop: "{{ verify_container_info.results }}"
      loop_control:
        label: "{{ item.item }}"
      no_log: true

    - name: Check that each service container runs, is healthy and restarts
      ansible.builtin.assert:
        that:
          - item.exists
          - item.running
          - item.health == 'healthy'
          - item.restart == 'unless-stopped'
        fail_msg: >-
          Container {{ item.name }}: exists={{ item.exists }}, running={{ item.running }},
          health={{ item.health }}, restart policy={{ item.restart }}.
          Expected running, healthy and unless-stopped. See: sudo docker logs {{ item.name }}
        quiet: true
      loop: "{{ verify_container_state | default([]) }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Check that service ports are published on 127.0.0.1 only
      ansible.builtin.assert:
        that: item.bindings | rejectattr('HostIp', 'equalto', '127.0.0.1') | list | length == 0
        fail_msg: >-
          Container {{ item.name }} publishes ports on other addresses: {{ item.bindings }}.
          Docker-published ports bypass UFW. Use 127.0.0.1:PORT:PORT.
        quiet: true
      loop: "{{ verify_container_state | default([]) }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Read the PostgreSQL network
      community.docker.docker_network_info:
        name: "{{ postgresql_network }}"
      register: verify_postgres_network
      when: postgresql_enabled | bool

    - name: Check that PostgreSQL is private
      ansible.builtin.assert:
        that:
          - verify_postgres_network.network.Internal
          - (verify_container_state | selectattr('name', 'equalto', 'postgres') | first).bindings | length == 0
          - (verify_container_state | selectattr('name', 'equalto', 'postgres') | first).networks == [postgresql_network]
        fail_msg: >-
          PostgreSQL must have no published ports and be attached only to the internal
          network {{ postgresql_network }}. See: sudo docker inspect postgres
        quiet: true
      when: postgresql_enabled | bool

    - name: Request each service site through Caddy on this server
      # --resolve sends the request to 127.0.0.1 with the right name for TLS,
      # so this works before DNS points to the server.
      ansible.builtin.command:
        argv: >-
          {{ ['curl', '-sS', '-o', '/dev/null', '-w', '%{http_code}', '--max-time', '10',
              '--resolve', item.domain ~ ':443:127.0.0.1']
             + (['--cacert', verify_caddy_ca] if caddy_local_certs | bool else [])
             + ['https://' ~ item.domain ~ '/'] }}
      changed_when: false
      failed_when: false
      register: verify_caddy_sites
      loop: "{{ caddy_service_sites if caddy_enabled | bool else [] }}"
      loop_control:
        label: "{{ item.domain }}"

    - name: Check that Caddy proxies each service over HTTPS
      ansible.builtin.assert:
        that:
          - item.rc == 0
          - item.stdout is match('^[23]')
        fail_msg: >-
          https://{{ item.item.domain }} through Caddy returned '{{ item.stdout }}'
          {{ item.stderr }}. Check "sudo journalctl -u caddy" and the container on
          127.0.0.1:{{ item.item.port }}.
        quiet: true
      loop: "{{ verify_caddy_sites.results }}"
      loop_control:
        label: "{{ item.item.domain }}"
