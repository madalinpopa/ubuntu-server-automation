# Project settings for Ansible. Ansible reads this file when you run
# commands from the repository root.
[defaults]
# Your real inventory. Copy inventory/hosts.example.yml to this path first.
inventory = inventory/hosts.yml
# Find Python on the server without printing a warning about it.
interpreter_python = auto_silent
# Do not write *.retry files after a failed run.
retry_files_enabled = false

[ssh_connection]
# Send modules over the open SSH session instead of copying files first.
# This makes runs faster. It works with the default Ubuntu sudo settings.
pipelining = true
