---
# Gitea, a self-hosted Git service.
#
# Settings come from GITEA__section__KEY environment variables, which the
# image writes into /data/gitea/conf/app.ini.
# Source: https://docs.gitea.com/installation/install-with-docker
#
# INSTALL_LOCK skips the web installer, so nobody can claim the instance by
# opening it first. Registration is closed and the admin account is created
# below. Git over SSH is off; clone and push over HTTPS.

- name: Check the Gitea admin password
  ansible.builtin.assert:
    that:
      - gitea_admin_password | length >= 12
      - "'replace-me' not in gitea_admin_password"
      - gitea_secret_key | length >= 32
      - "'replace-me' not in gitea_secret_key"
    fail_msg: >-
      Set vault_gitea_admin_password (at least 12 characters) and
      vault_gitea_secret_key (at least 32 characters) in the vault file.
    quiet: true
  no_log: true

- name: Create the Gitea database
  ansible.builtin.import_tasks: app_database.yml
  vars:
    app_db_name: "{{ gitea_db_name }}"
    app_db_user: "{{ gitea_db_user }}"
    app_db_password: "{{ gitea_db_password }}"

- name: Create the Gitea network
  community.docker.docker_network:
    name: gitea

- name: Create the Gitea data volume
  community.docker.docker_volume:
    name: gitea_data

- name: Run the Gitea container
  community.docker.docker_container:
    name: gitea
    image: "{{ gitea_image }}"
    state: healthy
    restart_policy: unless-stopped
    env:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: "{{ gitea_db_name }}"
      GITEA__database__USER: "{{ gitea_db_user }}"
      GITEA__database__PASSWD: "{{ gitea_db_password }}"
      GITEA__server__DOMAIN: "{{ gitea_domain or 'localhost' }}"
      GITEA__server__ROOT_URL: "{{ ('https://' ~ gitea_domain ~ '/') if gitea_domain else ('http://localhost:' ~ gitea_port ~ '/') }}"
      GITEA__server__DISABLE_SSH: "true"
      GITEA__security__INSTALL_LOCK: "true"
      # Without it Gitea falls back to a built-in key that is the same on
      # every install. Changing it later breaks stored 2FA secrets.
      GITEA__security__SECRET_KEY: "{{ gitea_secret_key }}"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__DEFAULT_USER_VISIBILITY: private
      GITEA__service__DEFAULT_ORG_VISIBILITY: private
      GITEA__repository__DEFAULT_PRIVATE: private
      GITEA__openid__ENABLE_OPENID_SIGNIN: "false"
      GITEA__openid__ENABLE_OPENID_SIGNUP: "false"
    networks:
      - name: gitea
      - name: "{{ postgresql_network }}"
    published_ports:
      - "127.0.0.1:{{ gitea_port }}:3000"
    volumes:
      - gitea_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
  no_log: true

- name: List the Gitea admin users
  community.docker.docker_container_exec:
    container: gitea
    user: git
    argv: [gitea, admin, user, list, --admin]
  register: gitea_admins
  changed_when: false

- name: Create the Gitea admin user
  # Only when it does not exist yet. Change the password later in Gitea.
  community.docker.docker_container_exec:
    container: gitea
    user: git
    argv:
      - gitea
      - admin
      - user
      - create
      - --admin
      - --username
      - "{{ gitea_admin_user }}"
      - --email
      - "{{ gitea_admin_email }}"
      - --password
      - "{{ gitea_admin_password }}"
      - --must-change-password=false
  when: gitea_admins.stdout is not search('(?m)^\d+\s+' ~ gitea_admin_user ~ '\s')
  no_log: true
