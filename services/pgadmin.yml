---
# pgAdmin, a web interface for PostgreSQL.
#
# Published on 127.0.0.1:pgadmin_port only. Reach it through an SSH tunnel:
#   ssh -L 5050:127.0.0.1:5050 sysadmin@your-server
# then open http://localhost:5050 and add a server with host "postgres",
# user "postgres" and the PostgreSQL password.
# It is on the internet only when pgadmin_domain is set (behind Caddy).

- name: Check the pgAdmin password
  ansible.builtin.assert:
    that:
      - pgadmin_password | length >= 12
      - "'replace-me' not in pgadmin_password"
    fail_msg: Set vault_pgadmin_password in the vault file (at least 12 characters).
    quiet: true
  no_log: true

- name: Warn that pgAdmin is on the internet
  ansible.builtin.debug:
    msg: >-
      WARNING: pgadmin_domain is set, so pgAdmin is reachable from the internet at
      https://{{ pgadmin_domain }}. Anyone who logs in controls every database.
      Prefer an SSH tunnel (leave pgadmin_domain empty).
  when: pgadmin_domain | length > 0

- name: Create the pgAdmin network
  community.docker.docker_network:
    name: pgadmin

- name: Create the pgAdmin data volume
  community.docker.docker_volume:
    name: pgadmin_data

- name: Run the pgAdmin container
  # The email and password are used only when the data volume is new.
  # Change the password later in pgAdmin itself.
  community.docker.docker_container:
    name: pgadmin
    image: "{{ pgadmin_image }}"
    state: healthy
    restart_policy: unless-stopped
    env:
      PGADMIN_DEFAULT_EMAIL: "{{ pgadmin_email }}"
      PGADMIN_DEFAULT_PASSWORD: "{{ pgadmin_password }}"
    networks:
      - name: pgadmin
      - name: "{{ postgresql_network }}"
    published_ports:
      - "127.0.0.1:{{ pgadmin_port }}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/misc/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
  no_log: true

- name: Publish pgAdmin through Caddy
  # Last step, so the app is public only after its admin account is set up.
  ansible.builtin.import_tasks: ../tasks/caddy_site.yml
  vars:
    caddy_site_name: pgadmin
    caddy_site_domain: "{{ pgadmin_domain }}"
    caddy_site_port: "{{ pgadmin_port }}"
  when:
    - caddy_enabled | bool
    - pgadmin_domain | length > 0
